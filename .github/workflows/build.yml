name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - v*
  pull_request:
    branches:
      - master
      - main
      - dev

jobs:
  build:
    runs-on: windows-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🔎 The name of the branch is ${{ github.ref }} and the repository is ${{ github.repository }}."
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore Dependencies
        run: dotnet restore
      - name: Publish
        run: dotnet publish RatScanner/RatScanner.csproj -c Release -o publish -p:PublishSingleFile=true --runtime win-x64 --self-contained
      - name: Include Data
        run: |
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/RatScanner/RatScannerData/releases/latest'
          foreach ($name in 'Data.zip', 'Data.zip.sha256') {
            $asset = $release.assets | Where-Object name -EQ $name
            if (-not $asset.browser_download_url) {
              throw "RatScannerData release $($release.tag_name) is missing $name."
            }
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile (Join-Path $env:RUNNER_TEMP $name)
          }

          $archive = Join-Path $env:RUNNER_TEMP 'Data.zip'
          $checksum = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'Data.zip.sha256') -Raw
          if ($checksum -notmatch '\A\s*(?<sha>[0-9a-f]{64})(?:[ \t]+\*?Data\.zip)?\s*\z') {
            throw 'Data.zip.sha256 must contain one SHA-256 digest for Data.zip.'
          }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $Matches.sha) {
            throw "Data.zip SHA-256 mismatch for RatScannerData release $($release.tag_name)."
          }

          7z x $archive -opublish/Data
          if ($LASTEXITCODE -ne 0) {
            throw "Data.zip extraction failed with exit code $LASTEXITCODE."
          }
      - name: Include Updater
        run: curl -L "https://github.com/RatScanner/RatUpdater/releases/latest/download/RatUpdater.exe" --output "publish/RatUpdater.exe"
      - name: Zip Content
        run: 7z a -r RatScanner.zip ./publish/*
      - uses: actions/upload-artifact@v4
        with:
          name: RatScanner
          path: ./publish/
      - name: Draft Release
        uses: softprops/action-gh-release@v1
        with:
          files: RatScanner.zip
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
      
